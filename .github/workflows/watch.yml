name: Daily watch scan

# Re-scans opportunities for every saved company once a day.
# Set repo secrets BIDSCOUT_API_URL (e.g. https://bidscout-api.onrender.com) and WATCH_TOKEN.
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 8am US Central
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API (free tier sleeps)
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "${{ secrets.BIDSCOUT_API_URL }}/health"
      - name: Run watch scan
        run: |
          curl -fsS -X POST --max-time 600 \
            -H "Authorization: Bearer ${{ secrets.WATCH_TOKEN }}" \
            "${{ secrets.BIDSCOUT_API_URL }}/api/watch/run-all"
